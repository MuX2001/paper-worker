[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-worker"
version = "0.1.0"
description = "Local arXiv analysis and archiving with Codex, Obsidian and Zotero"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["typer>=0.12,<1", "pydantic>=2.7,<3", "httpx>=0.27,<1", "pypdf>=5,<7", "jinja2>=3.1,<4", "pyyaml>=6,<7", "pyzotero>=1.6,<2", "tzdata>=2024.1"]

[project.optional-dependencies]
queue = ["supabase>=2,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9", "build>=1"]

[project.scripts]
paper-worker = "paper_worker.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_worker = ["prompts/*.txt", "defaults/*.md", "defaults/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
